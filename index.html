<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Super-Мен">
<meta name="application-name" content="Super-Мен">
<meta name="theme-color" content="#DDF0FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131833" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Super-Мен тест</title>
<style>
@font-face{font-family:"Nunito";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/nunito-600.ttf") format("truetype")}
@font-face{font-family:"Nunito";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/nunito-700.ttf") format("truetype")}
@font-face{font-family:"Nunito";font-weight:800;font-style:normal;font-display:swap;src:url("fonts/nunito-800.ttf") format("truetype")}
@font-face{font-family:"Nunito";font-weight:900;font-style:normal;font-display:swap;src:url("fonts/nunito-900.ttf") format("truetype")}
/* Layout: a comic-book page. One inked panel at a time on a halftone sky; big tap targets for a tablet. */
:root{
  --sky:#DDF0FF;        /* page ground */
  --dot:#BFE0FA;        /* halftone dots */
  --paper:#FFFFFF;      /* panels */
  --ink:#1F2340;        /* outlines + text */
  --soft:#5B6182;       /* secondary text */
  --hero:#E5293B;       /* Super-Мен red */
  --sun:#FFC83D;        /* yellow */
  --sea:#2B8FE0;        /* blue */
  --leaf:#23A35A;       /* correct */
  --leaf-bg:#E3F7EA;
  --oops:#E5293B;       /* wrong */
  --oops-bg:#FFE6E8;
  --chip:#FFF3CF;
  --shadow:#1F2340;
  --font-display:"Nunito","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#131833;--dot:#1D2449;--paper:#1C2245;--ink:#F2F3FF;--soft:#AEB4D6;
  --hero:#FF5566;--sun:#FFCF52;--sea:#5AB1FF;--leaf:#3DD07C;--leaf-bg:#16382A;
  --oops:#FF6B78;--oops-bg:#41202A;--chip:#3A3420;--shadow:#05070F;color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#131833;--dot:#1D2449;--paper:#1C2245;--ink:#F2F3FF;--soft:#AEB4D6;
  --hero:#FF5566;--sun:#FFCF52;--sea:#5AB1FF;--leaf:#3DD07C;--leaf-bg:#16382A;
  --oops:#FF6B78;--oops-bg:#41202A;--chip:#3A3420;--shadow:#05070F;color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background-color:var(--sky);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.45;
  background-image:radial-gradient(var(--dot) 2.2px,transparent 2.6px);background-size:22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
  overscroll-behavior-y:none;-webkit-text-size-adjust:100%;
}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.install{display:flex;gap:12px;align-items:center;background:var(--chip);border:3px dashed var(--ink);border-radius:18px;padding:12px 14px;font-weight:800;font-size:15px}
.install svg{flex:none;width:30px;height:30px}
.install b{color:var(--sea)}
.install button{margin-left:auto;flex:none;border:2px solid var(--ink);background:var(--paper);border-radius:10px;padding:4px 10px;font-weight:900}
button:focus-visible{outline:4px solid var(--sea);outline-offset:3px}

.panel{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--shadow);padding:22px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--font-display);font-weight:900;font-size:22px;letter-spacing:.5px;color:var(--hero);
  text-shadow:2px 2px 0 var(--paper),3px 3px 0 var(--ink);white-space:nowrap}
.iconbtn{width:46px;height:46px;border-radius:14px;border:3px solid var(--ink);background:var(--paper);box-shadow:3px 3px 0 var(--shadow);
  display:grid;place-items:center;flex:none}
.iconbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.iconbtn svg{width:24px;height:24px}

/* home */
.hero{position:relative;overflow:hidden;padding:26px 24px 24px}
.burst{position:absolute;right:-40px;top:-40px;width:190px;height:190px;opacity:.95}
.hello{font-family:var(--font-display);font-weight:900;font-size:clamp(30px,6vw,44px);line-height:1.05;margin:0 0 8px;text-wrap:balance;position:relative;max-width:16ch}
.hello span{color:var(--hero)}
.lead{margin:0;color:var(--soft);font-weight:700;max-width:46ch;position:relative}
.books{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px;position:relative}
.book{border:3px solid var(--ink);border-radius:16px;padding:12px 14px;background:var(--chip);min-width:0}
.book b{display:block;font-family:var(--font-display);font-weight:900;font-size:17px;line-height:1.2}
.book small{color:var(--soft);font-weight:700;font-size:14px}

h2.sec{font-family:var(--font-display);font-weight:900;font-size:20px;margin:6px 4px 0}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mode{text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--shadow);
  padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .08s}
.mode:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--shadow)}
.mode:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--shadow)}
.mode .tag{align-self:flex-start;font-size:13px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:2px solid var(--ink)}
.mode h3{margin:2px 0 0;font-family:var(--font-display);font-weight:900;font-size:21px;line-height:1.15}
.mode p{margin:0;color:var(--soft);font-weight:700;font-size:15px}
.mode .best{margin-top:4px;font-size:14px;font-weight:800;color:var(--ink)}
.t-red{background:var(--hero);color:#fff}
.t-blue{background:var(--sea);color:#fff}
.t-sun{background:var(--sun);color:#1F2340}
.t-leaf{background:var(--leaf);color:#fff}

.tips{display:flex;flex-direction:column;gap:8px;font-weight:700;color:var(--soft);font-size:16px}
.tips div{display:flex;gap:10px;align-items:flex-start}
.tips i{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:13px;color:var(--ink);background:var(--sun)}

/* quiz */
.hud{display:flex;align-items:center;gap:12px}
.track{flex:1;height:18px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.fill{height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--sun) 0 10px,#FFB703 10px 20px);border-right:3px solid var(--ink);transition:width .35s ease}
.count{font-weight:900;font-variant-numeric:tabular-nums;font-size:17px;white-space:nowrap}
.pts{display:flex;align-items:center;gap:6px;font-weight:900;font-variant-numeric:tabular-nums;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 12px 4px 6px;box-shadow:3px 3px 0 var(--shadow)}
.pts svg{width:24px;height:24px}

.qcard{display:flex;flex-direction:column;gap:16px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:13px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;padding:4px 11px;border-radius:999px;border:2px solid var(--ink)}
.streak{font-size:14px;font-weight:900;color:var(--hero)}
.qtext{font-family:var(--font-display);font-weight:900;font-size:clamp(22px,4.4vw,28px);line-height:1.25;margin:0;text-wrap:balance}
.quote{font-weight:800;font-size:19px;background:var(--chip);border-left:6px solid var(--sun);border-radius:10px;padding:10px 14px;margin:0}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:62px;padding:12px 16px;background:var(--paper);
  border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--shadow);font-weight:800;font-size:19px;line-height:1.3;transition:transform .08s,background .15s}
.opt:hover:not(:disabled){background:var(--chip)}
.opt:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.opt .k{flex:none;width:36px;height:36px;border-radius:11px;border:3px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:17px;background:var(--sky)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--leaf-bg);border-color:var(--leaf)}
.opt.ok .k{background:var(--leaf);border-color:var(--leaf);color:#fff}
.opt.bad{background:var(--oops-bg);border-color:var(--oops);animation:shake .35s}
.opt.bad .k{background:var(--oops);border-color:var(--oops);color:#fff}
.opt.dim{opacity:.5}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-size:22px;min-height:76px}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.tools{display:flex;gap:10px;flex-wrap:wrap}
.ghost{border:3px dashed var(--ink);background:transparent;border-radius:14px;padding:8px 14px;font-weight:800;font-size:16px}
.hintbox{font-weight:800;color:var(--sea)}

.fb{border:3px solid var(--ink);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--leaf-bg);border-color:var(--leaf)}
.fb.bad{background:var(--oops-bg);border-color:var(--oops)}
.fb h4{margin:0;font-family:var(--font-display);font-weight:900;font-size:22px}
.fb.ok h4{color:var(--leaf)}
.fb.bad h4{color:var(--oops)}
.fb p{margin:0;font-weight:700}
.fb .story{font-size:15px;color:var(--soft);font-weight:800}

.big{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:12px 26px;border-radius:18px;border:3px solid var(--ink);
  background:var(--hero);color:#fff;font-family:var(--font-display);font-weight:900;font-size:21px;box-shadow:5px 5px 0 var(--shadow)}
.big:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--shadow)}
.big.alt{background:var(--paper);color:var(--ink)}
.big.blue{background:var(--sea)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row .big{flex:1 1 200px}

/* results */
.res{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;overflow:hidden}
.medal{width:150px;height:150px}
.score{font-family:var(--font-display);font-weight:900;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:26px;color:var(--soft)}
.verdict{font-family:var(--font-display);font-weight:900;font-size:26px;margin:0;text-wrap:balance}
.sub{margin:0;color:var(--soft);font-weight:700;max-width:44ch}
.stars{display:flex;gap:6px}
.stars svg{width:44px;height:44px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.stat{border:3px solid var(--ink);border-radius:14px;padding:10px 6px;background:var(--sky)}
.stat b{display:block;font-family:var(--font-display);font-weight:900;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;font-weight:800;color:var(--soft)}
.review{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.rv{border:3px solid var(--ink);border-radius:14px;padding:12px 14px;background:var(--paper)}
.rv .q{font-weight:900;margin:0 0 4px}
.rv .a{margin:0;font-weight:700;color:var(--leaf)}
.rv .y{margin:0;font-weight:700;color:var(--oops);text-decoration:line-through}
.rv .s{margin:4px 0 0;font-size:14px;font-weight:800;color:var(--soft)}

canvas#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
.foot{text-align:center;color:var(--soft);font-weight:700;font-size:14px}

@media (max-width:560px){
  body{font-size:17px}
  .modes,.books{grid-template-columns:1fr}
  .panel{padding:18px}
  .opt{font-size:18px;min-height:58px}
  .logo{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap" id="app"></div>

<script>
/* ---------------- Question bank ---------------- */
const B1 = "Әдептілік — әдемілік";
const B2 = "Барлық қызық ауылда";
// t: mc (default) | tf | who ; a = correct ; w = wrong options ; e = explanation ; s = story title
const Q = [
/* ===== Кітап 1 ===== */
{b:1,s:"Демалыстан соң",q:"Мансұр жазғы демалысын қайда өткізді?",a:"Ауылда",w:["Дубайда","Лондонда","Теңіз жағасында"],e:"Мансұр ауылдан қалаға оралып, достарына ауылдағы демалысы туралы әңгімеледі."},
{b:1,s:"Демалыстан соң",q:"Алдияр демалысқа қай елге барды?",a:"Дубайға",w:["Лондонға","Жапонияға","Америкаға"],e:"Алдияр Дубайда күнге күйіп, теңізде шомылып қайтты."},
{b:1,s:"Демалыстан соң",t:"tf",q:"Денис демалысын Дубайда өткізді.",a:"Бұрыс",e:"Денис Лондонға барды. Дубайға барған — Алдияр."},
{b:1,s:"Демалыстан соң",q:"Лондонда ауа райы қандай болды?",a:"Бір күн ашық, бір күн жаңбыр",w:["Күнде өте ыстық","Күнде қар жауды","Үнемі жел соқты"],e:"Денис: «Біз барған Лондонда бір күн ашық, бір күн жаңбыр болды», — деді."},
{b:1,s:"Демалыстан соң",q:"Денис Лондонда не үйренді?",a:"Ағылшынша сөйлесуді",w:["Жүзуді","Атқа мінуді","Футбол ойнауды"],e:"Денис ағылшынша сөйлесіп үйреніп, әртүрлі мұражайларға барды."},
{b:1,s:"Демалыстан соң",q:"Мансұр ауылдағы демалысын қалай бағалады?",a:"«Міне» деп бас бармағын көтерді",w:["«Іш пысты» деді","«Жаман болды» деді","Үндемей қалды"],e:"«Ауылдағы демалыс «міне» болды», — деп Мансұр бас бармағын көтерді."},
{b:1,s:"Демалыстан соң",q:"Мансұр ауылда қандай ұлттық ойынды көрді?",a:"Көкпар",w:["Шахмат","Хоккей","Теннис"],e:"Мансұр ауылдың көкпарын көрді, көлге шомылды, жылқыға мінді, қой бақты."},

{b:1,s:"Тізім жазайық",q:"Дүкенге бармас бұрын анасы не істеу керек деді?",a:"Тізім жазу керек",w:["Ұйықтап алу керек","Ойыншық алу керек","Тамақ ішу керек"],e:"Анасы: «Дүкенге бармас бұрын, екеуміз бірге отырып тізім шығаруымыз керек», — деді."},
{b:1,s:"Тізім жазайық",q:"Тізім не үшін керек?",a:"Басқа заттарды қарап, уақытты шығындамау үшін",w:["Дүкеншіге көрсету үшін","Сурет салу үшін","Досына жіберу үшін"],e:"«Қолыңда тізімің болса, басқа заттарды қарап уақытыңды шығындамайсың»."},
{b:1,s:"Тізім жазайық",q:"Анасы тауарлардың бағасын қайдан тексерді?",a:"Ғаламтордан",w:["Газеттен","Көршіден","Теледидардан"],e:"Анасы бағаны ғаламтордан тексеріп салыстырды. Бұл ақшаны тиімді жұмсауға көмектеседі."},
{b:1,s:"Тізім жазайық",t:"tf",q:"Мансұр тізім жазуға бірден қуана келісті.",a:"Бұрыс",e:"Мансұр әдеттегідей шыдамсызданып: «Туу! Сол тізімнің не қажеті бар?» — деді."},

{b:1,s:"Ерте тұрған адамның...",q:"Мансұр қандай сөзді естіп, төсегінен тұрды?",a:"«Сыйлық»",w:["«Футбол»","«Тәтті»","«Мультфильм»"],e:"Анасы: «Бәрі ойдағыдай болса, саған сыйлық жасаймын», — деді. «Сыйлық» сөзін естіген Мансұр тұрды."},
{b:1,s:"Ерте тұрған адамның...",q:"Дүкенде алдымен не сатып алды?",a:"Мектеп формасын",w:["Рюкзакты","Ойыншықты","Футбол добын"],e:"«Кешегі жасаған тізім бойынша саған алдымен мектеп формасын аламыз»."},
{b:1,s:"Ерте тұрған адамның...",q:"Рюкзак қандай болуы керек?",a:"Жеңіл, арқаға ауырлық түсірмейтін",w:["Ең үлкені","Ең қымбаты","Ауыр әрі қатты"],e:"Рюкзак жеңіл, жасқа және сыртқы киімге үйлесімді болуы керек."},
{b:1,s:"Ерте тұрған адамның...",q:"Заттарды сатып алған соң дүкенде не болды?",a:"Үлкен кезек пайда болды",w:["Дүкен жабылды","Жарық сөніп қалды","Дүкен бос қалды"],e:"Ерте келгендіктен, олар кезекте тұрып уақыт жоғалтпады."},
{b:1,s:"Ерте тұрған адамның...",q:"Анасы Мансұрға қандай сыйлық жасады?",a:"Балаларға арналған киноға апарды",w:["Велосипед сатып алды","Тәтті алып берді","Ойыншық сыйлады"],e:"Анасы мен ұлы жақсы кино тамашалап демалды."},

{b:1,s:"Үйді не үшін тексереміз?",q:"Үйден шықпас бұрын анасы нені тексерді?",a:"Жарықты, электр құралдарын, терезелерді",w:["Тоңазытқыштағы тамақты","Ойыншықтарды","Кітаптарды"],e:"«Сөндірілмеген жарық, электр құралдары, терезелер ашық қалмасын»."},
{b:1,s:"Үйді не үшін тексереміз?",q:"Терезе ашық қалса не болуы мүмкін?",a:"Жаңбыр не жел үйге зақым келтіреді",w:["Үй жылынып кетеді","Ештеңе болмайды","Гүлдер өсіп кетеді"],e:"«Егер де жаңбыр жауып немесе жел соғып кетсе, үйімізге зақым келеді»."},
{b:1,s:"Үйді не үшін тексереміз?",q:"Сөндірілмеген электр құралдарынан не шығуы мүмкін?",a:"Өрт",w:["Су","Қар","Жаңбыр"],e:"Анасы: «Электр құралдарынан да өрт шығуы мүмкін», — деді."},
{b:1,s:"Үйді не үшін тексереміз?",q:"Олар қайда серуендеуге баратын еді?",a:"Саябаққа",w:["Көлге","Мұражайға","Тауға"],e:"Мансұр, анасы және қарындасы саябаққа серуендеуге баратын еді."},

{b:1,s:"Шіріген алма",q:"Футбол кезінде Мансұр не істеп қойды?",a:"Қақпашыға дөрекі сөз айтты",w:["Допты жоғалтты","Аяғын жарақаттады","Ойыннан кетіп қалды"],e:"Қақпашы бала допты ұстай алмағанда, Мансұр ашуланып дөрекі сөз айтты."},
{b:1,s:"Шіріген алма",q:"Әкесі Мансұрға қандай екі алма көрсетті?",a:"Таза алма мен құртталған алма",w:["Қызыл алма мен жасыл алма","Үлкен алма мен кіші алма","Тәтті алма мен қышқыл алма"],e:"Әкесі екі алма көрсетті: бірі — таза, екіншісі — құртталған."},
{b:1,s:"Шіріген алма",q:"Әкесінің сөзі бойынша дөрекі сөйлеген адам неге ұқсайды?",a:"Шіріген алмаға",w:["Таза алмаға","Тәтті кәмпитке","Футбол добына"],e:"«Жақсы сөйлеген адам таза алма сияқты, ал дөрекі сөйлеген адам шіріген алмаға ұқсайды»."},

{b:1,s:"Уақытыңды бағала!",q:"Анасы Мансұрға сағат нешеден кешікпе деді?",a:"Кешкі 7-ден",w:["Кешкі 5-тен","Кешкі 9-дан","Кешкі 10-нан"],e:"Анасы үйден шығар кезде «кешкі 7-ден кешікпе» деп ескерткен."},
{b:1,s:"Уақытыңды бағала!",q:"Мансұр үйге сағат нешеде оралды?",a:"Кешкі 10-да",w:["Кешкі 7-де","Кешкі 8-де","Түнгі 12-де"],e:"Ойынға беріліп кеткен Мансұр кешкі 10-да оралды. Ата-анасы уайымдап күтті."},
{b:1,s:"Уақытыңды бағала!",q:"Әкесі ойыннан кейін неге уақыт бөл деді?",a:"Демалып, кітап оқуға",w:["Теледидар көруге","Компьютер ойынына","Түнде серуендеуге"],e:"«Ойын ойнаған соң демалып, кітап оқуға да уақыт бөл»."},

{b:1,s:"Теңге тиыннан...",q:"Мансұр әкесі берген ақшаны неге жұмсады?",a:"Компьютер клубына",w:["Кітапқа","Тамаққа","Сыйлыққа"],e:"«Ол ақшаны кеше компьютер клубына жұмсап қойдым», — деді Мансұр."},
{b:1,s:"Теңге тиыннан...",q:"Әкесі керек жерде қандай сөзді айта білу керек деді?",a:"«Жоқ»",w:["«Иә»","«Рақмет»","«Сәлем»"],e:"«Достарыңның айтқандары әрқашан дұрыс бола бермейді. Керек жерде «жоқ» деп айта білуің қажет»."},
{b:1,s:"Теңге тиыннан...",q:"Әкесі компьютер клубының орнына не ұсынды?",a:"Таза ауада футбол ойнауды",w:["Ұйықтауды","Теледидар көруді","Дүкенге баруды"],e:"«Тар әрі қараңғы бөлмеде көзіңді ауыртқаннан гөрі, таза ауада футбол ойнағаның артық емес пе?!»"},
{b:1,s:"Теңге тиыннан...",q:"Мансұр мен Денисті клубқа кім шақырды?",a:"Алдияр",w:["Сара","Айдана","Мансұрдың әкесі"],e:"Алдияр: «Мансұр, Денис! Қане, клубқа кеттік», — деді."},
{b:1,s:"Теңге тиыннан...",t:"tf",q:"Мансұр әкесіне берген сөзінде тұрды.",a:"Дұрыс",e:"Мансұр клубқа бармады, алаңда футбол ойнады және сөзінде тұрғанына қуанды."},
{b:1,s:"Теңге тиыннан...",q:"Клубқа жалғыз барған Алдиярға не болды?",a:"Іші пысып, достарына қайта қосылды",w:["Ойынды ұтып алды","Ұйықтап қалды","Жаңа достар тапты"],e:"Қасында достары болмаған соң Алдиярдың іші пысып, аулаға қайта келді."},

{b:1,s:"Жарықты сөндірмесем не болады?",q:"Мансұр не істеуді ұмытып кетті?",a:"Бөлмесінің жарығын сөндіруді",w:["Тісін тазалауды","Сабағын оқуды","Есікті жабуды"],e:"Футболдан шаршап келген Мансұр жарықты сөндірмей ұйықтап қалды."},
{b:1,s:"Жарықты сөндірмесем не болады?",q:"Жарықты сөндірмей ұйықтаса не болады?",a:"Ұйқы бұзылады, энергия далаға кетеді",w:["Түсінде жақсы көреді","Ертерек оянады","Бөлме жылы болады"],e:"Анасы: «Жарықты сөндірмей ұйықтасаң ұйқың бұзылады. Қаншама энергия далаға кетеді», — деді."},
{b:1,s:"Жарықты сөндірмесем не болады?",q:"Жарық босқа жанса, қандай ақша соған кетеді?",a:"Ойыншықтар мен тәттілерге берілетін ақша",w:["Мектеп ақшасы","Ешқандай ақша кетпейді","Көлік ақшасы"],e:"«Ойыншықтарың мен тәттілеріңе берілетін ақша сол жарықты төлеуге кетеді»."},

{b:1,s:"Күш — білімде",q:"Мансұрдың нағашы атасы кім болып істеген?",a:"Университетте оқытушы",w:["Дәрігер","Жүргізуші","Аспаз"],e:"Нағашы атасы университетте оқытушы болғандықтан, үйде үлкен кітапхана бар."},
{b:1,s:"Күш — білімде",q:"Атасы неге кітап оқиды?",a:"Күшті болғысы келеді",w:["Іші пысқандықтан","Емтихан тапсыру үшін","Ұйықтау үшін"],e:"Атасы күлімдеп: «Себебі мен күшті болғым келеді», — деді."},
{b:1,s:"Күш — білімде",q:"Атасының айтуынша, оның күші неде?",a:"Білімінде",w:["Білегінде","Ақшасында","Көлігінде"],e:"«Ата болсам да, менің күшім — білімімде»."},
{b:1,s:"Күш — білімде",q:"Білім қашан көбейе түседі?",a:"Басқалармен бөліскенде және іске асырғанда",w:["Ешкімге айтпағанда","Кітапты жасырғанда","Көп ұйықтағанда"],e:"Мансұр білгенін бөлісіп, жасап көрсе, білімі көбейе түсетінін үйренді."},

{b:1,s:"Микроб деген не?",q:"Мансұр Айданаға қандай ертегі оқыды?",a:"«Кірқожалақ пен Тазабек»",w:["«Алдар Көсе»","«Ер Төстік»","«Қызыл телпек»"],e:"Мансұр «Кірқожалақ пен Тазабектің бастан кешкендері» деген ертегіні оқыды."},
{b:1,s:"Микроб деген не?",q:"Анасы микробты неге ұқсатты?",a:"Кішкентай әскерге",w:["Кішкентай құсқа","Жұлдызға","Гүлге"],e:"«Микроб деген топ-тобымен шабуыл жасайтын кішкентай әскер сияқты»."},
{b:1,s:"Микроб деген не?",q:"Ертегіні тыңдап жатқан Айданаға не болды?",a:"Ұйықтап қалды",w:["Жылап жіберді","Ойнауға кетті","Ертегіні өзі оқыды"],e:"Айдананың көзі ұйқыға кетті, ал ертегінің жартысы ертеңге қалды."},
{b:1,s:"Кірқожалаққа не болды?",q:"Кірқожалақтың іші неге ауырды?",a:"Жуылмаған алма мен жерге түскен кәмпит жеді",w:["Көп су ішті","Суықта жүрді","Көп жүгірді"],e:"Кірқожалақ: «Жуылмаған алмаларды, жерге түскен кәмпиттерді жедім», — деді."},
{b:1,s:"Кірқожалаққа не болды?",q:"Кірқожалаққа кім дәрі берді?",a:"Дәрігер",w:["Тазабек","Мансұр","Айдана"],e:"Тазабек дәрігер шақырды, дәрігер Кірқожалаққа дәрі берді."},
{b:1,s:"Кірқожалаққа не болды?",q:"Ертегінің соңында Айдана таза бала болғысы келе ме?",a:"Иә, «Иә!» деп айқайлады",w:["Жоқ деді","Үндемеді","Ұйықтап қалды"],e:"Дәрігердің сұрағына Айдана: «Иә!» — деп айқайлап жіберді."},

{b:1,s:"Дайындық",q:"Айдана неше жаста?",a:"4 жаста",w:["2 жаста","6 жаста","8 жаста"],e:"Мансұрдың 4 жасар қарындасы Айдана балабақшаға алғаш рет бармақшы."},
{b:1,s:"Дайындық",q:"Балабақшаға не апаратын болды?",a:"Ауыстырып киетін киімдерді",w:["Барлық ойыншықтарды","Қуыршақтарды","Кітаптарды"],e:"«Ол жақта да ойыншықтар табылады, біз тек сенің ауыстырып киетін киімдеріңді апарамыз»."},

{b:1,s:"Қош келдің, Айдана!",q:"Айдананың тәрбиешісінің аты кім?",a:"Айсұлу апай",w:["Қымбат апай","Сара апай","Дана апай"],e:"«Мен сенің тәрбиешің Айсұлу апай боламын», — деп өзін таныстырды."},
{b:1,s:"Қош келдің, Айдана!",q:"Балабақша қабырғасында кімдердің суреті бар еді?",a:"София ханшайым мен Маша",w:["Супермен мен Бэтмен","Алдар Көсе мен Ер Төстік","Микки мен Минни"],e:"«Анашым, София ханшайым мен Маша да балабақшаға барады екен ғой»."},
{b:1,s:"Сен келмейсің деп ойладым...",q:"Айдана балабақшада неге жылады?",a:"Анасы қоштаспай кетіп қалды",w:["Ойыншығы сынды","Тамақ ұнамады","Құлап қалды"],e:"Анасы қоштаспай шығып кетті. Айдана анасы өзін тастап кетті деп ойлады."},
{b:1,s:"Сен келмейсің деп ойладым...",q:"Айдананың анасына кім кеңес берді?",a:"Балабақшаның психологы",w:["Тәрбиеші","Дәрігер","Әжесі"],e:"Психолог: «Қоштасып, көп ұзамай алып кететініңізді айтып түсіндіріңіз», — деді."},

{b:1,s:"Бөлісіп ойнаған қызық",q:"Айдана ермексаздан не жасады?",a:"Үлкен үй",w:["Машина","Қуыршақ","Гүл"],e:"Айдана анасына ермексаздан үлкен үй жасағанын айтып берді."},
{b:1,s:"Бөлісіп ойнаған қызық",q:"Айдана үйді қандай түсті ермексаздан жасады?",a:"Көк",w:["Қызыл","Сары","Жасыл"],e:"«Себебі менде тек қана көк түсті ермексаз бар еді»."},
{b:1,s:"Бөлісіп ойнаған қызық",q:"Достары Айданаға неге ермексаз бермеді?",a:"Айдананың өзі де бөліспеген еді",w:["Олардың ермексазы жоқ еді","Тәрбиеші рұқсат бермеді","Олар ұйықтап жатты"],e:"«Өйткені, мен де олармен бөліспедім», — деді Айдана."},
{b:1,s:"Қашқын ермексаздар",q:"Айдананың түсінде ермексаздарға не болды?",a:"Аяқ пайда болып, қашып кетті",w:["Ұшып кетті","Ериді","Ән салды"],e:"Ермексазды қолына алғанда, оған аяқ пайда болып, қаша жөнелді."},
{b:1,s:"Қашқын ермексаздар",q:"Ермексаздар неге қашты?",a:"Айдана оларды достарына бермейтін",w:["Олар ұйықтағысы келді","Олар суық болды","Олар үйге асықты"],e:"«Сен бізді басқа достарымызға жібермейсің, жалғыз ойнағаннан қатты жалықтық!»"},
{b:1,s:"Қашқын ермексаздар",t:"tf",q:"Осы түстен кейін Айдана ойыншықтарын достарымен бөлісетін болды.",a:"Дұрыс",e:"Айдана түсін достарына айтып, енді үнемі ойыншықтарын бөлісетін болды."},

{b:1,s:"Рұқсат сұрау",q:"Айдана ағасына қандай сурет салды?",a:"Жүрек, ішінде өзі мен ағасы",w:["Үй мен күн","Футбол добы","Гүл шоғы"],e:"Айдана жүректің суретін салып, ішіне өзінің және ағасының суретін салды."},
{b:1,s:"Рұқсат сұрау",q:"Айдана ағасының нені рұқсатсыз алды?",a:"Түсті қарындаштарын",w:["Футбол добын","Кітабын","Рюкзагын"],e:"Айдана ағасының түсті қарындаштарын рұқсат сұрамастан алды."},
{b:1,s:"Рұқсат сұрау",q:"Мансұр Айданаға не деді?",a:"Рұқсат сұрағанда, бұдан да жақсыларын берер едім",w:["Енді ешқашан бермеймін","Анама айтамын","Қарындаштарды лақтырып жібер"],e:"Ағасы ашуланбай, қарындасының қателігін ашық айтып түсіндірді."},

{b:1,s:"«Мен — ең мықты футболшымын»",q:"Әкесі Мансұрдың ойынын қаншалықты жиі тамашалайды?",a:"Аптасына бір рет",w:["Күн сайын","Айына бір рет","Жылына бір рет"],e:"Аптасына бір рет әкесі Мансұрдың ойынын тамашалайды."},
{b:1,s:"«Мен — ең мықты футболшымын»",q:"Ойын кезінде Мансұр қандай қате жасады?",a:"Басқаларға мүмкіндік бермей, тек өзі гол соқпақ болды",w:["Қақпаға кірмеді","Допты жоғалтты","Ойынға кешікті"],e:"Мансұр тек өзі соғуға тырысты, сондықтан ойыншылардың арасында ұрыс шықты."},
{b:1,s:"Қауіпсіздік белбеуі",q:"Мансұр қандай футболшыдай болғысы келеді?",a:"Лионель Месси",w:["Роналду","Неймар","Мбаппе"],e:"«Мен Лионель Месси сияқты шабуылшы болсам, күшті болар еді», — деді Мансұр."},
{b:1,s:"Қауіпсіздік белбеуі",q:"Әкесінің айтуынша, Барселонада неше футболшы ойнайды?",a:"Он бір",w:["Бес","Жеті","Он бес"],e:"«Барселонада он бір футболшы ойнайды емес пе? Әрбір футболшының өз міндеті бар»."},
{b:1,s:"Қауіпсіздік белбеуі",q:"Мансұр белбеудің қажет екеніне қашан көзі жетті?",a:"Сыртта көлік апатын көргенде",w:["Әкесі ұрысқанда","Кітаптан оқығанда","Мектепте айтқанда"],e:"Апатқа ұшыраған көліктің жүргізушісі алдыңғы терезеден ұшып түсті. Мұны көріп Мансұр белбеуіне қарады."},
{b:1,s:"Футбол мектебі",q:"Ата-анасы Мансұр үшін қандай шешім қабылдады?",a:"Кәсіби футбол мектебіне жазу",w:["Футболға тыйым салу","Ауылға жіберу","Жаңа доп алу"],e:"Отбасылық кеңесте Мансұрды балаларға арналған кәсіби футбол мектебіне жазуды ұйғарды."},
{b:1,s:"Футбол мектебі",t:"who",q:"Кім айтты?",quote:"«Мен — ең мықты ойыншымын және ешқандай команданы қажет етпеймін!»",a:"Мансұр",w:["Алдияр","Денис","Әкесі"],e:"Мансұр ашуланып осылай деді де, алаңнан шығып кетті."},

/* ===== Кітап 2 ===== */
{b:2,s:"Қызықты тапсырма",q:"Мансұрдың сынып жетекшісі кім?",a:"Қымбат апай",w:["Айсұлу апай","Сара апай","Дана апай"],e:"Оқу жылының соңғы күні сынып жетекшісі Қымбат апай балаларға тапсырма берді."},
{b:2,s:"Қызықты тапсырма",q:"Қымбат апай жазғы демалысқа қандай тапсырма берді?",a:"Өздерің үшін жаңалық ашыңдар",w:["100 есеп шығарыңдар","Күнде өлең жаттаңдар","Сурет салыңдар"],e:"«Жаз мезгілі — жаңалықтар ашатын уақыт. Демалыста өздерің үшін жаңалық ашыңдар!»"},
{b:2,s:"Қызықты тапсырма",q:"Оқу жылының соңғы күні оқушылардың қолында не бар еді?",a:"Гүл шоғы",w:["Шар","Доп","Кітап"],e:"Барлық оқушы қолындағы гүл шоғын ұстаздарына табыстады."},
{b:2,s:"Қайда барамыз?",q:"Алдияр осы жылы не үйренді?",a:"Жүзуді",w:["Ағылшын тілін","Атқа мінуді","Шахмат ойнауды"],e:"«Мен осы жылы жүзуді үйренгенмін. Енді теңізде шомылатын болдым», — деді Алдияр."},
{b:2,s:"Қайда барамыз?",q:"Мансұр достарына неге ештеңе айтпады?",a:"Ауылға баратынын айтуға ұялды",w:["Ұмытып қалды","Ұйықтағысы келді","Достарына ренжіді"],e:"Достары Дубай мен Лондонға баратын кезде, Мансұр ауылға баратынын айтуға ұялды."},
{b:2,s:"Қайда барамыз?",t:"tf",q:"Аулада Алдияр, Денис және Сара ойнап жүрді.",a:"Дұрыс",e:"Аулада Алдияр, Денис және Сара ойнап жүр екен."},
{b:2,s:"Ақылдасу",q:"Әкесі «әлемдегі ең керемет жерге апарамыз» дегенде, Мансұр қайда деп ойлады?",a:"Америкаға",w:["Жапонияға","Ауылға","Ғарышқа"],e:"Мансұр: «Америкаға ма?» — деп сұрады. Әкесі: «Жо-жоқ. Ауылға барамыз», — деді."},
{b:2,s:"Ақылдасу",q:"Әкесі ауылда не істейміз деді?",a:"Көлге шомыламыз, балық аулаймыз, тауға шығамыз",w:["Мұражайға барамыз","Теңізде жүземіз","Ұшаққа мінеміз"],e:"«Ауылда қызық деген жетеді. Көлге шомыламыз, балық аулаймыз, тауға шығамыз»."},

{b:2,s:"Дүкенге кім барады?",q:"Таңғы ас кезінде дастарқанда не жоқ болып шықты?",a:"Сүт",w:["Нан","Шай","Қант"],e:"Анасы: «Мансұр, дүкеннен сүт әкеле аласың ба?» — деді."},
{b:2,s:"Дүкенге кім барады?",q:"Мансұр дүкенде кімді кездестірді?",a:"Сараны",w:["Денисті","Алдиярды","Қымбат апайды"],e:"Мансұр дүкенге барып, сол жерде Сараны көріп қалды."},
{b:2,s:"Дүкенге кім барады?",q:"Сара ауылда не істеуі керек екенін айтты?",a:"Анасына көмектесіп, інісіне қарауы керек",w:["Тек ойнауы керек","Кітап жазуы керек","Сабақ беруі керек"],e:"«Мен осы жазда анама көмектесіп, ініме қарауым керек», — деді Сара."},

{b:2,s:"Не сыйлаймын?",q:"Анасының айтуынша, сыйлық не береді?",a:"Адамдарды жақындастырады",w:["Ақшаны көбейтеді","Ұйқыны келтіреді","Ештеңе бермейді"],e:"«Сыйлық сыйлау адамдарды жақындастырады және біздің оларға деген сүйіспеншілігімізді көрсетеді»."},
{b:2,s:"Не сыйлаймын?",q:"Айдана ата-әжесіне қандай сыйлық дайындады?",a:"Сурет салды",w:["Кәмпит алды","Гүл өсірді","Өлең жазды"],e:"«Сен атаң мен әжеңе арнап сурет салып апарсаң болады»."},
{b:2,s:"Не сыйлаймын?",q:"Мансұр туыстарына не апаратын болды?",a:"Доп",w:["Сурет","Кітап","Кәмпит"],e:"«Онда, мен доп апарып берейін! Бәріміз бірге футбол ойнаймыз!»"},
{b:2,s:"Не сыйлаймын?",q:"Сыйлықта ең бастысы не?",a:"Шын көңілден беру",w:["Қымбат болуы","Үлкен болуы","Әдемі қорап"],e:"Анасы: «Сыйлықтың түр-түрі болады. Ең бастысы, шын көңілден беру керек», — деді."},

{b:2,s:"Қоқыс тауы",q:"Отбасы қайдан қайда сапар шекті?",a:"Астанадан Баянауылға",w:["Алматыдан Астанаға","Астанадан Алматыға","Шымкенттен Баянауылға"],e:"Астанадан Баянауылға шыққан жеңіл көлік тас жолда жылдам жүріп келеді."},
{b:2,s:"Қоқыс тауы",q:"Жол бойында қандай «тау» көрді?",a:"Қоқыс тауы",w:["Қар тауы","Құм тауы","Тас тауы"],e:"Бұл жай тау емес, орасан зор қоқыс тауы еді. Одан жағымсыз иіс шығып тұрды."},
{b:2,s:"Қоқыс тауы",q:"Жапонияда қоқысты қалай жинайды?",a:"Әртүрлі жәшікке бөліп салады",w:["Бәрін бір жерге тастайды","Теңізге тастайды","Жерге көмеді"],e:"Тамақ қалдығы, қағаз, пластик, темір бөлек-бөлек жиналып, зауытта қайта өңделеді."},
{b:2,s:"Қоқыс тауы",q:"Мансұр өскенде не істеуді армандады?",a:"Зауыт салып, айналаны қоқыстан тазартуды",w:["Ұшқыш болуды","Дүкен ашуды","Жапонияға көшуді"],e:"Мансұр өскенде сондай зауыт тұрғызып, айналаны қоқыстан тазартуды армандады."},

{b:2,s:"Ауылға қош келдің!",q:"Көлік ауылға неше сағатта жетті?",a:"Алты сағатта",w:["Екі сағатта","Он сағатта","Бір күнде"],e:"Көлік алты сағатта ауылға жетті."},
{b:2,s:"Ауылға қош келдің!",q:"Ауыл қай жерде орналасқан?",a:"Баянауыл тауының ең көркем жерінде",w:["Теңіз жағасында","Үлкен қаланың ортасында","Шөлде"],e:"Айналаның бәрі орман-тоғай, жазық жерде мал жайылып жүр."},
{b:2,s:"Ауылға қош келдің!",q:"Мақалды толықтыр: «Алыстан алты жасар бала келсе, ауылдың ... қарты сәлем береді»",a:"алпыстағы",w:["жетпістегі","сексендегі","отыздағы"],e:"Әжесі: «Қонаққа лайықты құрмет көрсету — біздің міндетіміз», — деді."},
{b:2,s:"Ауылға қош келдің!",q:"Үйден қандай тағамның иісі шықты?",a:"Жаңа піскен ет пен бауырсақ",w:["Пицца мен бургер","Балық пен күріш","Торт пен печенье"],e:"Әжесі қонақтардың келуіне керемет дайындалған екен."},

{b:2,s:"Ғажайып сөз",q:"Кішкентай бала Мансұрдың атасына қалай сәлем берді?",a:"«Ассалаумағалейкум!»",w:["«Сау болыңыз!»","«Қайырлы түн!»","«Рақмет!»"],e:"Кішкентай бала жүгіріп келіп: «Ассалаумағалейкум!» — деп қолын созды."},
{b:2,s:"Ғажайып сөз",q:"Сәлемге қалай жауап береді?",a:"«Уағалейкум ассалам»",w:["«Сау бол»","«Кешіріңіз»","«Әумин»"],e:"Атасы: «Сәлем алу да, сәлем беру сияқты маңызды іс», — деді."},
{b:2,s:"Ғажайып сөз",q:"Атасы кішкентай баланы қандай тілекпен шығарып салды?",a:"«Таудай бол!»",w:["«Күндей бол!»","«Жұлдыздай бол!»","«Бұлттай бол!»"],e:"«Уағалейкум ассалам! Таудай бол!» — деп атасы баланы шығарып салды."},
{b:2,s:"Ғажайып сөз",q:"Атасы сәлем беруді қандай дәстүр деді?",a:"Жүректі жібітетін дәстүр",w:["Ескі дәстүр","Тек үлкендердің ісі","Қажетсіз іс"],e:"«Иә, балам, сәлем беру — жүректі жібітетін дәстүр»."},
{b:2,s:"Ғажайып сөз",t:"tf",q:"Бірінші рет Мансұр кішкентай баланың сәлемін бірден алды.",a:"Бұрыс",e:"Мансұр абыржып, сәлемін алмай үнсіз тұрып қалды. Кейін атасынан үйренді."},

{b:2,s:"Қарным ашты...",q:"Мансұр қандай тамақты рұқсатсыз жеп қойды?",a:"Қонақтарға арналған тамақты",w:["Мысықтың тамағын","Ертеңгі таңғы асты","Айдананың кәмпитін"],e:"Үстел үстіндегі тамақ кешке келетін қонақтарға арналған еді."},
{b:2,s:"Қарным ашты...",q:"Анасы тамақты қалай жеу керек деді?",a:"Қол жуып, отырып, асықпай",w:["Тұрып, тез-тез","Жүгіріп жүріп","Теледидар қарап"],e:"«Асығып ішкен ас тамағыңа тұрып қалуы мүмкін. Тамақты да, суды да отырып ішсең жақсы сіңеді»."},

{b:2,s:"Супер-тағам",q:"Әжесі таңғы асқа не дайындады?",a:"Дәнді дақылдан жасалған ботқа",w:["Пицца","Шұжық","Чипсы"],e:"«Ботқаны сары маймен жегенің пайдалы болады», — деді әжесі."},
{b:2,s:"Супер-тағам",q:"Жент қандай тағам?",a:"Ұлттық тағам",w:["Шетел тағамы","Теңіз тағамы","Дәрі"],e:"«Әже, жент деген ұлттық тағам ба?» «Иә, ботам! Ауылда тек қана ұлттық тағамдар жейміз»."},
{b:2,s:"Супер-тағам",q:"Кешкі асқа әжесі қандай жеңіл тағам ұсынды?",a:"Бәліш пен айран",w:["Ет пен палау","Торт пен шай","Ботқа мен май"],e:"«Ет сияқты ауыр астан кейін, кешке жеңіл қортылатын бәліш пен айран ішесіңдер»."},
{b:2,s:"Супер-тағам",q:"Ет, палау сияқты тойымды тағамды қашан жеген дұрыс?",a:"Түсте",w:["Түнде","Таңертең ерте","Ұйықтар алдында"],e:"«Ет, палау сияқты тойымды тағамды түсте жеген дұрыс»."},
{b:2,s:"Супер-тағам",q:"Әжесінің асы неге мейрамханадағыдан да дәмді?",a:"Оған әжелік махаббат қосылған",w:["Қант көп салынған","Қымбат өнімнен жасалған","Тез піскен"],e:"«Өйткені оған сендерге деген әжелік махаббатымды қосамын!»"},

{b:2,s:"Жақсы тілек",q:"Бата деген не?",a:"Жақсы тілек",w:["Ойын","Ән","Тағам"],e:"Атасы: «Қалай айтсам, шырағым! Бата деген — жақсы тілек», — деді."},
{b:2,s:"Жақсы тілек",q:"Атасы жақсы тілекті неге ұқсатты?",a:"Жаңбырға",w:["Қарға","Желге","Күнге"],e:"«Жаңбыр жауғанда табиғат тазарып, құлпырғаны сияқты, бата да адам өмірін жақсылыққа толтырады»."},
{b:2,s:"Жақсы тілек",q:"Мақалды толықтыр: «Батамен ел көгерер, жаңбырмен ... көгерер»",a:"жер",w:["су","тау","үй"],e:"Қазақта «Батамен ел көгерер, жаңбырмен жер көгерер» деген мақал бар."},
{b:2,s:"Жақсы тілек",q:"Бата кезінде қолды неге жаямыз?",a:"Жақсы тілекті алақанға жинау үшін",w:["Қолды кептіру үшін","Сәлем беру үшін","Ойнау үшін"],e:"«Бата берілген уақытта сен жаңбыр тамшысы сияқты жақсы тілекті алақаныңа жинайсың»."},

/* ---------------- Helpers ---------------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sample(a,n){return shuffle(a).slice(0,n)}
const $app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let soundOn=store.get("sm_sound",true);

/* tiny sounds (start only after a tap) */
let actx=null;
function tone(freqs,dur=.12,type="triangle",vol=.08){
  if(!soundOn)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    let t=actx.currentTime;
    freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*dur);g.gain.linearRampToValueAtTime(vol,t+i*dur+.01);g.gain.exponentialRampToValueAtTime(.0001,t+i*dur+dur);
      o.connect(g).connect(actx.destination);o.start(t+i*dur);o.stop(t+i*dur+dur+.02)});
  }catch(e){}
}

const sndSVG=on=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>${on?'<path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>':'<path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>'}</svg>`;

function topbar(right=""){
  return `<div class="bar"><div class="logo">SUPER-МЕН тесті</div><div class="row" style="gap:10px;flex-wrap:nowrap">${right}
  <button class="iconbtn" id="snd" aria-label="${soundOn?"Дыбысты өшіру":"Дыбысты қосу"}">${sndSVG(soundOn)}</button></div></div>`;
}
function bindSound(){const b=document.getElementById("snd");if(b)b.onclick=()=>{soundOn=!soundOn;store.set("sm_sound",soundOn);b.innerHTML=sndSVG(soundOn);b.setAttribute("aria-label",soundOn?"Дыбысты өшіру":"Дыбысты қосу");if(soundOn)sfx.ok()}}

/* ---------------- Home ---------------- */
function home(){
  stopFx();
  const best=store.get("sm_best",{});
  $app.innerHTML=`${topbar()}
  <section class="panel hero">
    <svg class="burst" viewBox="0 0 200 200" aria-hidden="true">${burstPath()}</svg>
    <h1 class="hello">Сәлем, <span>Айназ!</span> Кітапты қаншалықты жақсы білесің?</h1>
    <p class="lead">Сұрақтар «SUPER-МЕН» кітапшаларындағы әңгімелер бойынша құрылған. Дұрыс жауап үшін 10 ұпай, кеңес алсаң 5 ұпай аласың.</p>
    <div class="books">
      <div class="book"><b>«${B1}»</b><small>Тізім жазайық, Шіріген алма, Рұқсат сұрау…</small></div>
      <div class="book"><b>«${B2}»</b><small>Ғажайып сөз, Көкпар, Атамның батасы…</small></div>
    </div>
  </section>
  ${installHint()}
  <h2 class="sec">Тесті таңда</h2>
  <div class="modes">${MODES.map(m=>{
    const b=best[m.id];
    return `<button class="mode" data-m="${m.id}"><span class="tag ${m.cls}">${m.tag}</span><h3>${esc(m.title)}</h3><p>${esc(m.desc)}</p>
    <span class="best">${b?`Ең жақсы нәтиже: ${b.c}/${b.n} · ${b.p} ұпай`:"Әлі шешілмеген"}</span></button>`}).join("")}
  </div>
  <section class="panel tips">
    <div><i>1</i><span>Сұрақты асықпай оқы. Жауапты басқан соң, түсіндірмесін де оқып шық.</span></div>
    <div><i>2</i><span>Есіңе түспесе, «Кеңес» батырмасын бас: ол қай әңгіме екенін көрсетеді.</span></div>
    <div><i>3</i><span>Соңында қате кеткен сұрақтарды қайта шешіп, бәрін жаттап ал.</span></div>
  </section>
  <p class="foot">Барлығы ${Q.length} сұрақ · 2 кітапша · 1-тоқсан қорытындысына дайындық</p>`;
  bindSound();
  $app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{const m=MODES.find(x=>x.id===b.dataset.m);start(m.id,m.pick())});
  window.scrollTo(0,0);
}
function installHint(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const standalone=window.navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
  if(!ios||standalone||store.get("sm_hide_install",false))return "";
  setTimeout(()=>{const x=document.getElementById("hideInstall");if(x)x.onclick=()=>{store.set("sm_hide_install",true);x.parentElement.remove()}},0);
  return `<div class="install"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7.5 7.5L12 3l4.5 4.5" fill="none" stroke="var(--sea)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 11H6a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-2" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/></svg>
  <span>Қолданба ретінде орнату: <b>Бөлісу</b> батырмасын басып, <b>«На экран „Домой“»</b> таңда.</span><button id="hideInstall" aria-label="Жабу">✕</button></div>`;
}
function burstPath(){let p="";const n=14,cx=100,cy=100;for(let i=0;i<n*2;i++){const a=i*Math.PI/n,r=i%2?62:96;p+=(i?"L":"M")+(cx+r*Math.cos(a)).toFixed(1)+" "+(cy+r*Math.sin(a)).toFixed(1)}
  return `<path d="${p}Z" fill="var(--sun)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>${starSVG("var(--hero)").replace('<svg viewBox="0 0 24 24" aria-hidden="true">','<g transform="translate(62 62) scale(3.2)">').replace("</svg>","</g>")}`}

/* ---------------- Quiz ---------------- */
let S=null;
function start(mode,list){
  S={mode,list,i:0,pts:0,correct:0,hints:0,streak:0,bestStreak:0,wrong:[]};
  tone([440],.05,"sine",.0001); // unlock audio on first tap
  question();
}
function question(){
  const q=S.list[S.i],n=S.list.length;
  const tf=q.t==="tf";
  const opts=tf?["Дұрыс","Бұрыс"]:shuffle([q.a,...q.w]);
  S.cur={q,opts,hint:false,done:false};
  const keys=["А","Ә","Б","В"];
  const label=tf?"Дұрыс па, бұрыс па?":(q.t==="who"?"Кім айтты?":"Сұрақ");
  const pillCls=q.b===1?"t-red":"t-blue";
  $app.innerHTML=`${topbar(`<div class="pts" aria-label="Ұпай">${starSVG("var(--sun)")}<span id="pts">${S.pts}</span></div>`)}
  <div class="hud"><button class="iconbtn" id="home" aria-label="Басты бетке">${homeSVG}</button>
    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${S.i}"><div class="fill" style="width:${S.i/n*100}%"></div></div>
    <span class="count">${S.i+1} / ${n}</span></div>
  <section class="panel qcard">
    <div class="qmeta"><span class="pill ${pillCls}">${q.b}-кітап</span><span class="pill t-sun">${label}</span>${S.streak>=3?`<span class="streak">Қатарынан ${S.streak} дұрыс!</span>`:""}</div>
    ${q.t==="who"?`<blockquote class="quote">${esc(q.quote)}</blockquote>`:""}
    <h2 class="qtext">${esc(q.t==="who"?"Бұл сөзді кім айтты?":q.q)}</h2>
    <div class="opts ${tf?"tf":""}">${opts.map((o,k)=>`<button class="opt" data-o="${esc(o)}">${tf?"":`<span class="k">${keys[k]}</span>`}<span>${esc(o)}</span></button>`).join("")}</div>
    <div class="tools" id="tools"><button class="ghost" id="hint">Кеңес: қай әңгіме?</button></div>
    <div id="fb"></div>
  </section>`;
  bindSound();
  document.getElementById("home").onclick=()=>home();
  document.getElementById("hint").onclick=e=>{S.cur.hint=true;e.target.outerHTML=`<span class="hintbox">Әңгіме: «${esc(q.s)}»</span>`};
  $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b));
  window.scrollTo({top:0,behavior:"smooth"});
}
function answer(btn){
  if(S.cur.done)return; S.cur.done=true;
  const q=S.cur.q,pick=btn.dataset.o,ok=pick===q.a;
  $app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.o===q.a)b.classList.add("ok");else if(b===btn)b.classList.add("bad");else b.classList.add("dim")});
  if(ok){S.correct++;S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);S.pts+=S.cur.hint?5:10;if(S.cur.hint)S.hints++;sfx.ok();burst(btn)}
  else{S.streak=0;S.wrong.push({q,pick});sfx.bad()}
  document.getElementById("pts").textContent=S.pts;
  const praise=["Жарайсың!","Керемет!","Тамаша!","Дұрыс таптың!","Супер!","Міне, нағыз Супер-қыз!"];
  const oops=["Қап, қателестің","Ештеңе етпейді","Келесі жолы табасың"];
  const last=S.i===S.list.length-1;
  document.getElementById("tools").remove();
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}" role="status">
    <h4>${ok?praise[Math.floor(Math.random()*praise.length)]+(S.cur.hint?" +5":" +10"):oops[Math.floor(Math.random()*oops.length)]}</h4>
    ${ok?"":`<p>Дұрыс жауабы: <b>${esc(q.a)}</b></p>`}
    <p>${esc(q.e)}</p><span class="story">Әңгіме: «${esc(q.s)}» · ${q.b===1?B1:B2}</span></div>
    <div class="row" style="margin-top:14px"><button class="big ${ok?"blue":""}" id="next">${last?"Нәтижені көру":"Келесі сұрақ"}</button></div>`;
  const nx=document.getElementById("next");nx.focus({preventScroll:true});
  nx.onclick=()=>{S.i++;S.i<S.list.length?question():results()};
  nx.scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* ---------------- Results ---------------- */
function results(){
  const n=S.list.length,c=S.correct,pct=c/n;
  const stars=pct>=.95?3:pct>=.8?2:pct>=.6?1:0;
  const v=[["Тағы бір рет көрейік!","Әңгімелерді қайта оқып, тағы шешіп көр. Сен міндетті түрде үйренесің!"],
           ["Жақсы бастама!","Қате кеткен сұрақтарды қайталасаң, нәтижең бірден өседі."],
           ["Өте жақсы!","Сен кітапты жақсы білесің. Сәл ғана қалды!"],
           ["Сен — нағыз чемпион!","Керемет нәтиже! Тестке толық дайынсың."]][stars];
  const best=store.get("sm_best",{});const prev=best[S.mode];
  const isBest=!prev||S.pts>prev.p;
  if(isBest&&S.mode!=="retry"){best[S.mode]={c,n,p:S.pts};store.set("sm_best",best)}
  $app.innerHTML=`${topbar()}
  <section class="panel res">
    <svg class="medal" viewBox="0 0 160 160" aria-hidden="true">
      <path d="M52 8h22l10 40H62z" fill="var(--hero)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M108 8H86L76 48h22z" fill="var(--sea)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="80" cy="98" r="52" fill="var(--sun)" stroke="var(--ink)" stroke-width="4"/>
      <circle cx="80" cy="98" r="38" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="4 5"/>
      <text x="80" y="112" text-anchor="middle" font-family="Nunito,system-ui,sans-serif" font-weight="900" font-size="40" fill="#1F2340">${Math.round(pct*100)}%</text>
    </svg>
    <div class="stars">${[0,1,2].map(k=>starSVG(k<stars?"var(--sun)":"var(--paper)")).join("")}</div>
    <h2 class="verdict">${v[0]}</h2>
    <div class="score">${c}<small> / ${n}</small></div>
    <p class="sub">${v[1]}${isBest&&prev&&S.mode!=="retry"?" Жаңа рекорд!":""}</p>
    <div class="stats">
      <div class="stat"><b>${S.pts}</b><span>ұпай</span></div>
      <div class="stat"><b>${S.bestStreak}</b><span>қатарынан дұрыс</span></div>
      <div class="stat"><b>${S.wrong.length}</b><span>қате</span></div>
    </div>
    <div class="row" style="width:100%">
      ${S.wrong.length?`<button class="big" id="retry">Қателерді қайта шешу</button>`:""}
      <button class="big ${S.wrong.length?"alt":""}" id="again">Басқа тест таңдау</button>
    </div>
    ${S.wrong.length?`<h2 class="sec" style="align-self:flex-start">Қате кеткен сұрақтар</h2><div class="review">${S.wrong.map(w=>`<div class="rv">
      <p class="q">${esc(w.q.t==="who"?w.q.quote+" — кім айтты?":w.q.q)}</p>
      <p class="y">${esc(w.pick)}</p><p class="a">${esc(w.q.a)}</p><p class="s">«${esc(w.q.s)}»</p></div>`).join("")}</div>`:""}
  </section>`;
  bindSound();
  const r=document.getElementById("retry");if(r)r.onclick=()=>start("retry",shuffle(S.wrong.map(w=>w.q)));
  document.getElementById("again").onclick=()=>home();
  window.scrollTo(0,0);
  if(stars>=1){sfx.win();confetti(stars*60)}
}

/* ---------------- Confetti ---------------- */
const cv=document.getElementById("fx"),cx=cv.getContext("2d");let parts=[],raf=null;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function sizeCv(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener("resize",sizeCv);sizeCv();
const COLS=["#E5293B","#FFC83D","#2B8FE0","#23A35A","#FF8FB1"];
function spawn(x,y,n,spread){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*spread,vy:-Math.random()*spread*.9-2,r:4+Math.random()*5,c:COLS[i%COLS.length],a:Math.random()*6,va:(Math.random()-.5)*.3,life:90+Math.random()*60,star:Math.random()<.35})}
function loop(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life-->0&&p.y<innerHeight+30);
  for(const p of parts){p.vy+=.18;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;
    if(p.star){cx.beginPath();for(let k=0;k<10;k++){const r=k%2?p.r*.45:p.r*1.2,an=k*Math.PI/5;cx.lineTo(r*Math.cos(an),r*Math.sin(an))}cx.closePath();cx.fill()}
    else cx.fillRect(-p.r/2,-p.r/3,p.r,p.r*.66);cx.restore()}
  raf=parts.length?requestAnimationFrame(loop):null}
function run(){if(!raf)raf=requestAnimationFrame(loop)}
function burst(el){if(reduce)return;const r=el.getBoundingClientRect();spawn(r.left+r.width/2,r.top+r.height/2,18,9);run()}
function confetti(n){if(reduce)return;for(let k=0;k<3;k++)setTimeout(()=>{spawn(innerWidth*(.2+.3*k),innerHeight*.35,n/3|0,14);run()},k*220)}
function stopFx(){parts=[]}

/* keyboard: 1-4 to answer, Enter for next */
addEventListener("keydown",e=>{
  if(!S||!document.querySelector(".qcard"))return;
  if(!S.cur.done&&/^[1-4]$/.test(e.key)){const b=$app.querySelectorAll(".opt")[+e.key-1];if(b)b.click()}
  else if(S.cur.done&&e.key==="Enter"){const nx=document.getElementById("next");if(nx&&document.activeElement!==nx)nx.click()}
});

home();
if("serviceWorker" in navigator&&location.protocol!=="file:"){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
