<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Super-Мен">
<meta name="application-name" content="Super-Мен">
<meta name="theme-color" content="#DDF0FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131833" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Super-Мен</title>
<style>
@font-face{font-family:"Nunito";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/nunito-600.ttf") format("truetype")}
@font-face{font-family:"Nunito";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/nunito-700.ttf") format("truetype")}
@font-face{font-family:"Nunito";font-weight:800;font-style:normal;font-display:swap;src:url("fonts/nunito-800.ttf") format("truetype")}
@font-face{font-family:"Nunito";font-weight:900;font-style:normal;font-display:swap;src:url("fonts/nunito-900.ttf") format("truetype")}
/* Layout: a comic-book page. One inked panel at a time on a halftone sky; big tap targets for a tablet. */
:root{
  --sky:#DDF0FF;        /* page ground */
  --dot:#BFE0FA;        /* halftone dots */
  --paper:#FFFFFF;      /* panels */
  --ink:#1F2340;        /* outlines + text */
  --soft:#5B6182;       /* secondary text */
  --hero:#E5293B;       /* Super-Мен red */
  --sun:#FFC83D;        /* yellow */
  --sea:#2B8FE0;        /* blue */
  --leaf:#23A35A;       /* correct */
  --leaf-bg:#E3F7EA;
  --oops:#E5293B;       /* wrong */
  --oops-bg:#FFE6E8;
  --chip:#FFF3CF;
  --shadow:#1F2340;
  --font-display:"Nunito","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#131833;--dot:#1D2449;--paper:#1C2245;--ink:#F2F3FF;--soft:#AEB4D6;
  --hero:#FF5566;--sun:#FFCF52;--sea:#5AB1FF;--leaf:#3DD07C;--leaf-bg:#16382A;
  --oops:#FF6B78;--oops-bg:#41202A;--chip:#3A3420;--shadow:#05070F;color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#131833;--dot:#1D2449;--paper:#1C2245;--ink:#F2F3FF;--soft:#AEB4D6;
  --hero:#FF5566;--sun:#FFCF52;--sea:#5AB1FF;--leaf:#3DD07C;--leaf-bg:#16382A;
  --oops:#FF6B78;--oops-bg:#41202A;--chip:#3A3420;--shadow:#05070F;color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background-color:var(--sky);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.45;
  background-image:radial-gradient(var(--dot) 2.2px,transparent 2.6px);background-size:22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
  overscroll-behavior-y:none;-webkit-text-size-adjust:100%;
}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.install{display:flex;gap:12px;align-items:center;background:var(--chip);border:3px dashed var(--ink);border-radius:18px;padding:12px 14px;font-weight:800;font-size:15px}
.install svg{flex:none;width:30px;height:30px}
.install b{color:var(--sea)}
.install button{margin-left:auto;flex:none;border:2px solid var(--ink);background:var(--paper);border-radius:10px;padding:4px 10px;font-weight:900}
button:focus-visible{outline:4px solid var(--sea);outline-offset:3px}

.panel{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--shadow);padding:22px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--font-display);font-weight:900;font-size:22px;letter-spacing:.5px;color:var(--hero);
  text-shadow:2px 2px 0 var(--paper),3px 3px 0 var(--ink);white-space:nowrap}
.iconbtn{width:46px;height:46px;border-radius:14px;border:3px solid var(--ink);background:var(--paper);box-shadow:3px 3px 0 var(--shadow);
  display:grid;place-items:center;flex:none}
.iconbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.iconbtn svg{width:24px;height:24px}

/* home */
.hero{position:relative;overflow:hidden;padding:26px 24px 24px}
.burst{position:absolute;right:-40px;top:-40px;width:190px;height:190px;opacity:.95}
.hello{font-family:var(--font-display);font-weight:900;font-size:clamp(30px,6vw,44px);line-height:1.05;margin:0 0 8px;text-wrap:balance;position:relative;max-width:16ch}
.hello span{color:var(--hero)}
.lead{margin:0;color:var(--soft);font-weight:700;max-width:46ch;position:relative}
.books{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px;position:relative}
.book{border:3px solid var(--ink);border-radius:16px;padding:12px 14px;background:var(--chip);min-width:0}
.book b{display:block;font-family:var(--font-display);font-weight:900;font-size:17px;line-height:1.2}
.book small{color:var(--soft);font-weight:700;font-size:14px}

h2.sec{font-family:var(--font-display);font-weight:900;font-size:20px;margin:6px 4px 0}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mode{text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--shadow);
  padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .08s}
.mode:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--shadow)}
.mode:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--shadow)}
.mode .tag{align-self:flex-start;font-size:13px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:2px solid var(--ink)}
.mode h3{margin:2px 0 0;font-family:var(--font-display);font-weight:900;font-size:21px;line-height:1.15}
.mode p{margin:0;color:var(--soft);font-weight:700;font-size:15px}
.mode .best{margin-top:4px;font-size:14px;font-weight:800;color:var(--ink)}
.t-red{background:var(--hero);color:#fff}
.t-blue{background:var(--sea);color:#fff}
.t-sun{background:var(--sun);color:#1F2340}
.t-leaf{background:var(--leaf);color:#fff}

.tips{display:flex;flex-direction:column;gap:8px;font-weight:700;color:var(--soft);font-size:16px}
.tips div{display:flex;gap:10px;align-items:flex-start}
.tips i{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:13px;color:var(--ink);background:var(--sun)}

/* quiz */
.hud{display:flex;align-items:center;gap:12px}
.track{flex:1;height:18px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.fill{height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--sun) 0 10px,#FFB703 10px 20px);border-right:3px solid var(--ink);transition:width .35s ease}
.count{font-weight:900;font-variant-numeric:tabular-nums;font-size:17px;white-space:nowrap}
.pts{display:flex;align-items:center;gap:6px;font-weight:900;font-variant-numeric:tabular-nums;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 12px 4px 6px;box-shadow:3px 3px 0 var(--shadow)}
.pts svg{width:24px;height:24px}

.qcard{display:flex;flex-direction:column;gap:16px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:13px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;padding:4px 11px;border-radius:999px;border:2px solid var(--ink)}
.streak{font-size:14px;font-weight:900;color:var(--hero)}
.qtext{font-family:var(--font-display);font-weight:900;font-size:clamp(22px,4.4vw,28px);line-height:1.25;margin:0;text-wrap:balance}
.quote{font-weight:800;font-size:19px;background:var(--chip);border-left:6px solid var(--sun);border-radius:10px;padding:10px 14px;margin:0}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:62px;padding:12px 16px;background:var(--paper);
  border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--shadow);font-weight:800;font-size:19px;line-height:1.3;transition:transform .08s,background .15s}
.opt:hover:not(:disabled){background:var(--chip)}
.opt:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.opt .k{flex:none;width:36px;height:36px;border-radius:11px;border:3px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:17px;background:var(--sky)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--leaf-bg);border-color:var(--leaf)}
.opt.ok .k{background:var(--leaf);border-color:var(--leaf);color:#fff}
.opt.bad{background:var(--oops-bg);border-color:var(--oops);animation:shake .35s}
.opt.bad .k{background:var(--oops);border-color:var(--oops);color:#fff}
.opt.dim{opacity:.5}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-size:22px;min-height:76px}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

.tools{display:flex;gap:10px;flex-wrap:wrap}
.ghost{border:3px dashed var(--ink);background:transparent;border-radius:14px;padding:8px 14px;font-weight:800;font-size:16px}
.hintbox{font-weight:800;color:var(--sea)}

.fb{border:3px solid var(--ink);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--leaf-bg);border-color:var(--leaf)}
.fb.bad{background:var(--oops-bg);border-color:var(--oops)}
.fb h4{margin:0;font-family:var(--font-display);font-weight:900;font-size:22px}
.fb.ok h4{color:var(--leaf)}
.fb.bad h4{color:var(--oops)}
.fb p{margin:0;font-weight:700}
.fb .story{font-size:15px;color:var(--soft);font-weight:800}

.big{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:12px 26px;border-radius:18px;border:3px solid var(--ink);
  background:var(--hero);color:#fff;font-family:var(--font-display);font-weight:900;font-size:21px;box-shadow:5px 5px 0 var(--shadow)}
.big:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--shadow)}
.big.alt{background:var(--paper);color:var(--ink)}
.big.blue{background:var(--sea)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row .big{flex:1 1 200px}

/* results */
.res{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;overflow:hidden}
.medal{width:150px;height:150px}
.score{font-family:var(--font-display);font-weight:900;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:26px;color:var(--soft)}
.verdict{font-family:var(--font-display);font-weight:900;font-size:26px;margin:0;text-wrap:balance}
.sub{margin:0;color:var(--soft);font-weight:700;max-width:44ch}
.stars{display:flex;gap:6px}
.stars svg{width:44px;height:44px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.stat{border:3px solid var(--ink);border-radius:14px;padding:10px 6px;background:var(--sky)}
.stat b{display:block;font-family:var(--font-display);font-weight:900;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;font-weight:800;color:var(--soft)}
.review{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.rv{border:3px solid var(--ink);border-radius:14px;padding:12px 14px;background:var(--paper)}
.rv .q{font-weight:900;margin:0 0 4px}
.rv .a{margin:0;font-weight:700;color:var(--leaf)}
.rv .y{margin:0;font-weight:700;color:var(--oops);text-decoration:line-through}
.rv .s{margin:4px 0 0;font-size:14px;font-weight:800;color:var(--soft)}

canvas#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
.foot{text-align:center;color:var(--soft);font-weight:700;font-size:14px}

@media (max-width:560px){
  body{font-size:17px}
  .modes,.books{grid-template-columns:1fr}
  .panel{padding:18px}
  .opt{font-size:18px;min-height:58px}
  .logo{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root{--t1:#2B8FE0;--t2:#7C5CE6;--t3:#E0782B;--t4:#E5293B;--t5:#14A3A3;--t6:#E54B8A;--flame:#FF8A3D;--lock:#D9DEEA;--ok-ink:#1B7F45}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lock:#3A4170;--ok-ink:#6FE3A2}}
:root[data-theme="dark"]{--lock:#3A4170;--ok-ink:#6FE3A2}

.bar-r{display:flex;gap:10px;align-items:center;flex:none}
.ttl{flex:1;min-width:0;margin:0;font-family:var(--font-display);font-weight:900;font-size:22px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead2{margin:0 4px;font-weight:700;color:var(--soft)}
.foot{margin:0}

/* profile */
.prof{display:flex;gap:18px;align-items:center}
.ava{position:relative;flex:none;width:92px;height:92px;border-radius:50%;border:3px solid var(--ink);background:var(--sea);display:grid;place-items:center;box-shadow:4px 4px 0 var(--shadow)}
.ava svg{width:70px;height:70px}
.ava b{position:absolute;font-family:var(--font-display);font-weight:900;font-size:24px;color:#1F2340;top:50%;left:50%;transform:translate(-50%,-38%)}
.ava.big{width:120px;height:120px;margin:0 auto}.ava.big svg{width:92px;height:92px}.ava.big b{font-size:30px}
.prof-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.hi{margin:0;font-family:var(--font-display);font-weight:900;font-size:clamp(26px,5vw,34px);line-height:1.1}
.hi span{color:var(--hero)}
.rank{margin:0;font-weight:900;color:var(--sea)}
.xpbar{height:20px;border:3px solid var(--ink);border-radius:999px;background:var(--sky);overflow:hidden;margin-top:4px}
.xpbar div{height:100%;background:repeating-linear-gradient(-45deg,var(--sun) 0 10px,#FFB703 10px 20px);border-right:3px solid var(--ink);transition:width .6s}
.xptxt{margin:0;font-size:14px;font-weight:800;color:var(--soft)}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--shadow);padding:10px 6px;text-align:center;min-width:0}
.chip svg{width:30px;height:30px}
.chip b{font-family:var(--font-display);font-weight:900;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.chip span{font-size:13px;font-weight:800;color:var(--soft)}
button.chip:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.goal{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px}
.goal>div:first-child{display:flex;flex-direction:column}
.goal b{font-family:var(--font-display);font-weight:900;font-size:19px}
.goal span{font-weight:700;color:var(--soft);font-size:15px}
.dots{display:flex;gap:8px}
.dots i{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-style:normal;font-weight:900;color:var(--soft);background:var(--sky)}
.dots i.on{background:var(--leaf);color:#fff}.dots i svg{width:22px;height:22px}
.subjects{display:grid;gap:14px}
.subj{display:flex;align-items:center;gap:16px;text-align:left;padding:16px 18px;border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--shadow);color:#fff;min-height:96px}
.subj:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--shadow)}
.s-math{background:var(--t1)}.s-kaz{background:var(--t6)}.s-book{background:var(--sun);color:#1F2340}
.sic{flex:none;width:64px;height:64px;border-radius:18px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:900;font-size:26px}
.sic svg{width:34px;height:34px}
.stx{display:flex;flex-direction:column;min-width:0}
.stx b{font-family:var(--font-display);font-weight:900;font-size:24px;line-height:1.15}
.stx small{font-weight:800;font-size:15px;opacity:.92}

/* topics */
.topics{display:grid;gap:12px}
.topic{display:flex;align-items:center;gap:14px;text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--shadow);padding:14px 16px}
.topic:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--shadow)}
.tbadge{flex:none;min-width:60px;height:60px;padding:0 8px;border-radius:16px;border:3px solid var(--ink);display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:900;font-size:20px;white-space:nowrap}
.tbadge.big{min-width:84px;height:84px;font-size:28px;border-radius:22px;margin:0 auto}
.tmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tmain b{font-family:var(--font-display);font-weight:900;font-size:20px;line-height:1.2}
.tmain small{font-weight:700;color:var(--soft);font-size:14px}
.tinfo{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:900;color:var(--sea)}
.tinfo svg{width:16px;height:16px}
.tstars{flex:none;display:flex;gap:2px;align-items:center}
.tstars svg{width:24px;height:24px}
.tstars b{font-family:var(--font-display);font-weight:900;font-size:24px}
.tstars small{font-size:12px;font-weight:800;color:var(--soft);margin-left:4px}
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.intro h2{margin:0;font-family:var(--font-display);font-weight:900;font-size:28px;text-wrap:balance}
.rule{width:100%;text-align:left;background:var(--chip);border:3px dashed var(--ink);border-radius:18px;padding:14px 18px}
.rule b{font-family:var(--font-display);font-weight:900;font-size:19px;color:var(--hero)}
.rule ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:18px}
.ibox{display:flex;gap:10px;width:100%;justify-content:center;flex-wrap:wrap}
.ibox div{flex:1 1 110px;display:flex;flex-direction:column;align-items:center;border:3px solid var(--ink);border-radius:16px;background:var(--sky);padding:8px}
.ibox svg{width:24px;height:24px}
.ibox b{font-family:var(--font-display);font-weight:900;font-size:24px;font-variant-numeric:tabular-nums}
.ibox span{font-size:13px;font-weight:800;color:var(--soft)}
.intro .big{width:100%;max-width:360px}

/* round */
.tmr{display:flex;align-items:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:5px 14px 5px 6px;box-shadow:3px 3px 0 var(--shadow);font-family:var(--font-display);font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;flex:none}
.ring{--p:100%;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:conic-gradient(var(--sea) var(--p),var(--sky) 0)}
.tmr.hot{color:var(--hero);animation:pulse 1s infinite}
.tmr.hot .ring{background:conic-gradient(var(--hero) var(--p),var(--sky) 0)}
@keyframes pulse{50%{transform:scale(1.07)}}
.blitzc{flex:1;display:flex;align-items:center;gap:6px;font-weight:900;font-size:18px}
.blitzc svg{width:28px;height:28px}.blitzc b{font-family:var(--font-display);font-size:28px}
.ptsmall{margin-left:auto;display:flex;align-items:center;gap:4px;font-weight:900;font-variant-numeric:tabular-nums}
.ptsmall svg{width:22px;height:22px}
.combo{font-size:14px;font-weight:900;color:#fff;background:var(--hero);border:2px solid var(--ink);border-radius:999px;padding:3px 10px;animation:pop .3s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.qlabel{margin:0;font-weight:800;color:var(--soft)}
.expr{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;font-family:var(--font-display);font-weight:900;font-size:clamp(32px,7vw,48px);line-height:1.2;padding:10px 0 4px;text-align:center}
.blank{min-width:2.4em;padding:0 .25em;border:4px dashed var(--sea);border-radius:16px;color:var(--soft);background:var(--sky);font-variant-numeric:tabular-nums;transition:background .15s}
.blank.filled{border-style:solid;color:var(--ink);background:var(--paper)}
.blank.ok{border-color:var(--leaf);background:var(--leaf-bg);color:var(--ok-ink)}
.blank.bad{border-color:var(--oops);background:var(--oops-bg);color:var(--oops);text-decoration:line-through;animation:shake .35s}
.blank.nudge{animation:shake .35s}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:520px;width:100%;margin:0 auto}
.key{min-height:70px;border:3px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:4px 4px 0 var(--shadow);font-family:var(--font-display);font-weight:900;font-size:32px;display:grid;place-items:center}
.key:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.key svg{width:32px;height:32px}
.k-del{background:var(--sky)}
.key.k-ok{background:var(--leaf);color:#fff;font-size:19px}
.pad.off{opacity:.45;pointer-events:none}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.three .opt{justify-content:center;font-size:30px;min-height:76px}
.opts.three .opt .k{display:none}
mark{background:var(--sun);color:#1F2340;border-radius:6px;padding:0 4px}
.fb.slim{padding:8px 14px}
.float{position:fixed;transform:translate(-50%,0);z-index:60;pointer-events:none;font-family:var(--font-display);font-weight:900;font-size:30px;color:var(--leaf);-webkit-text-stroke:1.5px var(--ink);animation:up .95s ease-out forwards}
@keyframes up{to{transform:translate(-50%,-70px);opacity:0}}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:70;display:flex;align-items:center;gap:12px;background:var(--hero);color:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--shadow);padding:18px 26px;font-family:var(--font-display);font-size:30px;animation:pop .35s}
.toast svg{width:36px;height:36px}

/* results */
.bigstars{display:flex;gap:10px}
.bs svg{width:64px;height:64px}
.bs.on{animation:starin .5s both}
@keyframes starin{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.newb{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.newb span{display:flex;align-items:center;gap:6px;background:var(--chip);border:2px solid var(--ink);border-radius:999px;padding:4px 12px 4px 4px;font-weight:900}
.newb svg{width:30px;height:30px}
.stat span{display:block}
.rv .y{text-decoration:none}

/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(15,18,40,.55);display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.mbox{width:min(440px,100%);text-align:center;display:flex;flex-direction:column;gap:12px;animation:pop .3s}
.mtitle{margin:0;font-family:var(--font-display);font-weight:900;font-size:28px}
.mmedal svg{width:120px;height:120px}
.mbox .row .big{flex:1 1 140px}

/* badges */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bdg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--shadow);padding:12px 10px;min-width:0}
.bdg svg{width:64px;height:64px}
.bdg b{font-family:var(--font-display);font-weight:900;font-size:16px;line-height:1.2}
.bdg small{font-size:13px;font-weight:700;color:var(--soft)}
.bdg.lock{opacity:.6;box-shadow:none}
.lvls{display:flex;flex-direction:column;gap:6px}
.lv{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--soft)}
.lv i{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-style:normal;font-weight:900;background:var(--lock);color:var(--ink)}
.lv.on{color:var(--ink)}.lv.on i{background:var(--sun);color:#1F2340}
.lv small{margin-left:auto;font-variant-numeric:tabular-nums}

@media (max-width:560px){
  .prof{gap:12px}.ava{width:72px;height:72px}.ava svg{width:54px;height:54px}.ava b{font-size:19px}
  .chip b{font-size:20px}.chip span{font-size:12px}
  .stx b{font-size:21px}.sic{width:54px;height:54px;font-size:22px}
  .key{min-height:62px;font-size:28px}
  .opts.two{grid-template-columns:1fr}
  .ttl{font-size:18px}
  .tbadge{min-width:52px;height:52px;font-size:17px}
}
</style>
</head>

<canvas id="fx" aria-hidden="true"></canvas>
<main class="wrap" id="app"></main>
<script src="books.js"></script>
<script src="tasks.js"></script>
<script src="app.js"></script>
</body>
